name: Publication

on:
  repository_dispatch:
    types: [deploy, remove]
  push:
    branches: [main]
    paths: ['.github/pages/**', '.github/scripts/publish.sh']
  workflow_dispatch:
    inputs:
      action:
        description: Action
        type: choice
        options: [publier, supprimer, synchroniser]
      repository:
        description: Repo (ex. code-lab ; pas pour synchroniser)
      branche:
        description: Branche buildée, sans build/ (pas pour synchroniser)

permissions:
  contents: write

concurrency:
  group: publish-${{ github.event.client_payload.repository || inputs.repository || 'sync' }}-${{ github.event.client_payload.branch || inputs.branche || 'sync' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAGES_URL: https://dguillaume17.github.io
    steps:
      - name: Paramètres
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.repository }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_BRANCH: ${{ inputs.branche }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$INPUT_ACTION" = synchroniser ]; then
            echo "ACTION=sync" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then
            vAction=$EVENT_ACTION
            vRepository=$PAYLOAD_REPOSITORY
            vBranch=$PAYLOAD_BRANCH
          else
            vAction=deploy
            [ "$INPUT_ACTION" = supprimer ] && vAction=remove
            vRepository=$GITHUB_REPOSITORY_OWNER/${INPUT_REPOSITORY##*/}
            vBranch=$INPUT_BRANCH
          fi
          vBranch=${vBranch#build/}
          if ! [[ "$vRepository" =~ ^$GITHUB_REPOSITORY_OWNER/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Repo refusé : $vRepository (seulement ceux de $GITHUB_REPOSITORY_OWNER)."
            exit 1
          fi
          if [ -z "$vBranch" ] || [[ "$vBranch" == *$'\n'* ]] || ! git check-ref-format "refs/heads/build/$vBranch"; then
            echo "::error::Nom de branche invalide : $vBranch."
            exit 1
          fi
          {
            echo "ACTION=$vAction"
            echo "REPOSITORY=$vRepository"
            echo "BRANCH=$vBranch"
          } >> "$GITHUB_ENV"

      - name: Scripts et fichiers communs
        uses: actions/checkout@v5
        with:
          path: common
          sparse-checkout: .github
          persist-credentials: false

      - name: Branche builds
        uses: actions/checkout@v5
        with:
          ref: builds
          path: pages

      - name: Accès à ${{ env.REPOSITORY }}
        if: env.ACTION != 'sync'
        env:
          GH_TOKEN: ${{ secrets.SOURCES_TOKEN || github.token }}
          HAS_SOURCES_TOKEN: ${{ secrets.SOURCES_TOKEN != '' }}
        run: |
          if ! gh api "repos/$REPOSITORY" --silent 2> /dev/null; then
            if [ "$HAS_SOURCES_TOKEN" = true ]; then
              echo "::error::Le secret SOURCES_TOKEN ne donne pas accès à $REPOSITORY (Contents: Read sur ce repo)."
            else
              echo "::error::$REPOSITORY est privé ou introuvable : ajouter le secret SOURCES_TOKEN à ce repo (jeton fine-grained, Contents: Read)."
            fi
            exit 1
          fi

      - name: Récupère build/${{ env.BRANCH }} de ${{ env.REPOSITORY }}
        if: env.ACTION == 'deploy'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REPOSITORY }}
          ref: refs/heads/build/${{ env.BRANCH }}
          token: ${{ secrets.SOURCES_TOKEN || github.token }}
          path: site
          persist-credentials: false

      - name: Informations du build
        if: env.ACTION == 'deploy'
        working-directory: site
        run: |
          if [ ! -f .build.json ]; then
            echo "::error::Pas de .build.json dans build/$BRANCH : branche à reconstruire avec le workflow Build du repo."
            exit 1
          fi
          vNumber=$(jq -r '.buildNumber' .build.json)
          vCommit=$(jq -r '.commit' .build.json)
          vDatetime=$(jq -r '.buildDatetime' .build.json)
          if ! [[ "$vNumber" =~ ^[0-9]+$ && "$vCommit" =~ ^[0-9a-f]{40}$ && "$vDatetime" =~ ^[0-9T:Z-]+$ ]]; then
            echo "::error::.build.json invalide."
            exit 1
          fi
          {
            echo "BUILD_NUMBER=$vNumber"
            echo "COMMIT_SHA=$vCommit"
            echo "BUILD_DATETIME=$vDatetime"
          } >> "$GITHUB_ENV"
          rm -rf .git .build.json

      - name: Branches buildées du repo
        if: env.ACTION != 'sync'
        env:
          GH_TOKEN: ${{ secrets.SOURCES_TOKEN || github.token }}
        run: |
          if gh api "repos/$REPOSITORY/branches" --paginate --jq '.[].name' > "$RUNNER_TEMP/all-branches.txt"; then
            sed -n 's|^build/||p' "$RUNNER_TEMP/all-branches.txt" > "$RUNNER_TEMP/branches.txt"
          else
            echo "::warning::Liste des branches indisponible : pas de nettoyage des sites des branches supprimées."
          fi

      - name: Publie
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -s "$RUNNER_TEMP/branches.txt" ]; then
            export EXISTING_BRANCHES_FILE="$RUNNER_TEMP/branches.txt"
          fi
          export PAGES_SOURCE="$GITHUB_WORKSPACE/common/.github/pages"
          "$GITHUB_WORKSPACE/common/.github/scripts/publish.sh" "$ACTION" "${REPOSITORY:-}" "${BRANCH:-}" "$GITHUB_WORKSPACE/site"
