name: React

on:
  workflow_call:
    inputs:
      working-directory:
        description: Dossier du projet (celui de package.json)
        type: string
        default: '.'
      node-version:
        description: Version de Node
        type: string
        default: '22'
      test-command:
        description: Commande des tests ; vide pour ne pas en lancer
        type: string
        default: npm run test --if-present
      build-command:
        description: Commande du build
        type: string
        default: npm run build -- --base=./
      output-path:
        description: Dossier buildé à publier, relatif à working-directory ; par défaut dist, sinon build
        type: string
        default: ''
      badge:
        description: Affiche le numéro de build et la branche dans un petit badge en bas à droite du site
        type: boolean
        default: true
    secrets:
      PAGES_TOKEN:
        required: true
    outputs:
      url:
        description: Adresse du site publié
        value: ${{ jobs.publish.outputs.url }}

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Tests
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Dossier à publier
        env:
          OUTPUT_PATH: ${{ inputs.output-path }}
        run: |
          if [ -z "$OUTPUT_PATH" ]; then
            for fCandidate in dist build; do
              if [ -f "$fCandidate/index.html" ]; then
                OUTPUT_PATH=$fCandidate
                break
              fi
            done
          fi
          if [ -z "$OUTPUT_PATH" ] || [ ! -f "$OUTPUT_PATH/index.html" ]; then
            echo "::error::Pas d'index.html dans ${OUTPUT_PATH:-dist ni build} ; sinon, donner output-path."
            exit 1
          fi
          echo "SITE_PATH=$(realpath "$OUTPUT_PATH")" >> "$GITHUB_ENV"

      - name: Dépose le site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ env.SITE_PATH }}

  publish:
    needs: build
    uses: dguillaume17/dguillaume17.github.io/.github/workflows/publish.yml@main
    with:
      badge: ${{ inputs.badge }}
    secrets:
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}

  remove:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    uses: dguillaume17/dguillaume17.github.io/.github/workflows/publish.yml@main
    with:
      action: remove
      branch: ${{ github.event.ref }}
    secrets:
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
