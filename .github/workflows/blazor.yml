name: Blazor

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: Version du SDK .NET
        type: string
        default: 10.0.x
      project:
        description: Projet Blazor WebAssembly (.csproj) ; par défaut le seul du repo
        type: string
        default: ''
      test-command:
        description: Commande des tests ; vide pour ne pas en lancer
        type: string
        default: dotnet test -c Release
      aot:
        description: Compilation AOT en WebAssembly (code plus rapide, téléchargement plus lourd, publication plus longue)
        type: boolean
        default: false
      publish-args:
        description: Arguments supplémentaires de dotnet publish
        type: string
        default: ''
    secrets:
      PAGES_TOKEN:
        required: true
    outputs:
      url:
        description: Adresse du site publié
        value: ${{ jobs.publish.outputs.url }}

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: build-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Outils de compilation AOT WebAssembly
        if: inputs.aot
        run: dotnet workload install wasm-tools

      - name: Tests
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Projet Blazor WebAssembly
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          if [ -z "$PROJECT" ]; then
            vFound=$(grep -rl --include=*.csproj 'Microsoft.NET.Sdk.BlazorWebAssembly' . || true)
            if [ "$(printf '%s' "$vFound" | grep -c .)" != 1 ]; then
              echo "::error::Il faut exactement un projet Blazor WebAssembly (trouvé : ${vFound:-aucun}) ; sinon, donner project."
              exit 1
            fi
            PROJECT=$vFound
          fi
          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: Publish
        env:
          BuildBranch: ${{ github.ref_name }}
          AOT: ${{ inputs.aot }}
          PUBLISH_ARGS: ${{ inputs.publish-args }}
        run: |
          dotnet publish "$PROJECT_PATH" -c Release -o "$RUNNER_TEMP/publish" -p:BuildNumber=$GITHUB_RUN_NUMBER \
            -p:RunAOTCompilation=$AOT -p:CompressionEnabled=false $PUBLISH_ARGS
          echo "SITE_PATH=$RUNNER_TEMP/publish/wwwroot" >> "$GITHUB_ENV"

      - name: Dépose le site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ env.SITE_PATH }}
          retention-days: 1

  publish:
    needs: build
    uses: dguillaume17/dguillaume17.github.io/.github/workflows/publish.yml@main
    secrets:
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}

  remove:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    uses: dguillaume17/dguillaume17.github.io/.github/workflows/publish.yml@main
    with:
      action: remove
      branch: ${{ github.event.ref }}
    secrets:
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
